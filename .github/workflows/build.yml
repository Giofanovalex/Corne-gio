name: Build QMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan Anda untuk menjalankan build secara manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    
    steps:
      - name: Disable Git ownership checks
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout Userspace Keymap
        uses: actions/checkout@v4
        with:
          path: userspace

      - name: Copy keymap to QMK directory
        run: |
          mkdir -p qmk_firmware/keyboards/crkbd/keymaps/vieri
          cp -r userspace/keyboards/crkbd/keymaps/vieri/* qmk_firmware/keyboards/crkbd/keymaps/vieri/

      - name: Compile firmware
        run: |
          cd qmk_firmware
          qmk compile -kb crkbd/rev1 -km vieri

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: crkbd_rev1_vieri_firmware
          path: |
            qmk_firmware/*.hex
            qmk_firmware/*.bin
            qmk_firmware/*.uf2
            qmk_firmware/.build/*.hex
            qmk_firmware/.build/*.bin
            qmk_firmware/.build/*.uf2
